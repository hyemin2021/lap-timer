<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>랩 타이머 디자인 시안 3종</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
    background: #d9dce1;
    color: #111;
    padding: 28px 20px 60px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lead { margin: 0 0 28px; color: #444; font-size: 14px; }
  .theme { margin-bottom: 44px; }
  .theme > h2 { font-size: 18px; margin: 0 0 4px; }
  .theme > p { margin: 0 0 14px; color: #444; font-size: 13px; max-width: 760px; line-height: 1.5; }
  .row { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 6px; }
  .phone {
    flex: none;
    width: 260px;
    height: 540px;
    border-radius: 30px;
    border: 8px solid #1b1b1d;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 28px rgb(0 0 0 / 0.18);
  }
  .cap { font-size: 12px; color: #555; text-align: center; margin-top: 6px; }
  .col { display: flex; flex-direction: column; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ========== 공통 구조 (테마 변수만 다름) ========== */
  /* intro */
  .intro { padding: 44px 18px 16px; gap: 16px; }
  .intro .title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .intro .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .intro .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .intro .big { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .intro .big svg { width: 40%; }
  .intro .chk { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .intro .chk i { width: 15px; height: 15px; display: inline-block; }
  .intro .hist { margin-top: 4px; padding: 12px 14px; font-size: 12.5px; }
  .intro .hist h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .intro .hist div { display: flex; justify-content: space-between; padding: 7px 0; }
  .intro .hist small { color: var(--muted); }
  .intro .ver { margin-top: auto; text-align: center; font-size: 10px; color: var(--muted); }
  /* exam */
  .exam .top { display: flex; justify-content: space-between; align-items: center; padding: 30px 14px 10px; font-size: 12px; font-weight: 700; }
  .exam .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .exam .pause { font-size: 12px; font-weight: 700; padding: 6px 14px; }
  .exam .ctl { display: flex; gap: 8px; padding: 12px 12px 18px; height: 190px; }
  .exam .side { display: flex; flex-direction: column; gap: 8px; width: 32%; }
  .exam .side div { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; }
  .exam .next { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .exam .next b { font-size: 40px; line-height: 1; }
  .exam .next span { font-size: 14px; font-weight: 700; margin-top: 4px; }
  /* answers */
  .ans { padding: 30px 12px 12px; gap: 9px; }
  .ans .hd { font-size: 17px; font-weight: 800; padding: 0 2px; }
  .ans .tabs { display: flex; padding: 3px; }
  .ans .tabs div { flex: 1; text-align: center; padding: 7px 0; font-size: 11.5px; font-weight: 700; }
  .ans .chips { display: flex; gap: 5px; }
  .ans .chips div { padding: 5px 9px; font-size: 11px; font-weight: 700; }
  .ans .sheet { padding: 10px; flex: 1; }
  .ans .sheet .meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
  .ans .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .ans .grp > div { display: flex; justify-content: space-between; align-items: center; padding: 3px 9px; font-size: 11px; }
  .ans .grp b { font-size: 15px; }

  /* ========== A. OMR 답안지 ========== */
  .t-omr {
    --bg: #ffffff; --ink: #141414; --ink-2: #2b2b2b; --muted: #8a5a64;
    --omr: #e2405f; --omr-soft: #fde8ec; --omr-line: #f3a6b5;
  }
  .t-omr .screen { background-image: linear-gradient(var(--omr-soft) 0 0); background-size: 100% 6px; background-repeat: no-repeat; }
  .t-omr .intro .title { color: var(--ink); }
  .t-omr .intro .title span { color: var(--omr); }
  .t-omr .big.play { background: #141414; color: #fff; border-radius: 6px; }
  .t-omr .big.sheet { background: #fff; color: var(--omr); border: 2px solid var(--omr); border-radius: 6px;
    background-image: repeating-linear-gradient(to bottom, transparent 0 13px, var(--omr-soft) 13px 14px); }
  .t-omr .chk i { border: 2px solid var(--omr); border-radius: 50%; background: radial-gradient(circle, #141414 0 45%, transparent 48%); }
  .t-omr .hist { border: 1.5px solid var(--omr); border-radius: 4px; }
  .t-omr .hist h4 { color: var(--omr); letter-spacing: 0.08em; }
  .t-omr .hist div + div { border-top: 1px dashed var(--omr-line); }
  .t-omr .exam .top { border-bottom: 2px solid var(--omr); color: var(--omr); }
  .t-omr .exam .top em { font-style: normal; color: #141414; border: 1.5px solid #141414; padding: 3px 9px; border-radius: 3px; }
  .t-omr .timer { width: 168px; border: 2px solid var(--omr); border-radius: 4px; text-align: center; background: #fff; }
  .t-omr .timer small { display: block; background: var(--omr); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; padding: 3px 0; }
  .t-omr .timer strong { display: block; font-size: 40px; font-weight: 800; padding: 10px 0 8px; letter-spacing: 0.02em; }
  .t-omr .pause { border: 1.5px solid #141414; border-radius: 3px; }
  .t-omr .ctl { border-top: 2px solid var(--omr); background: var(--omr-soft); }
  .t-omr .side div { background: #fff; border: 1.5px solid var(--omr); color: var(--omr); border-radius: 4px; }
  .t-omr .side div:first-child { color: #141414; border-color: #141414; }
  .t-omr .next { background: #141414; color: #fff; border-radius: 6px; }
  .t-omr .next b { width: 64px; height: 64px; border-radius: 50%; border: 2.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .t-omr .tabs { border: 1.5px solid var(--omr); border-radius: 4px; }
  .t-omr .tabs .on { background: var(--omr); color: #fff; border-radius: 2px; }
  .t-omr .tabs div:not(.on) { color: var(--omr); }
  .t-omr .chips div { border: 1.5px solid var(--omr-line); color: var(--omr); border-radius: 3px; }
  .t-omr .chips .on { background: #141414; border-color: #141414; color: #fff; }
  .t-omr .sheet { border: 2px solid var(--omr); border-radius: 4px; }
  .t-omr .sheet .meta span { color: var(--omr); }
  .t-omr .grp { border: 1.5px solid var(--omr); border-radius: 2px; }
  .t-omr .grp > div + div { border-top: 1px solid var(--omr-line); }
  .t-omr .grp > div:nth-child(odd) { background: var(--omr-soft); }
  .t-omr .grp span { color: var(--omr); font-weight: 700; }

  /* ========== B. 토스 스타일 ========== */
  .t-toss { --bg: #f2f4f6; --ink: #191f28; --ink-2: #4e5968; --muted: #8b95a1; --blue: #3182f6; --card: #fff; }
  .t-toss .intro .title { font-size: 24px; }
  .t-toss .big { border-radius: 20px; }
  .t-toss .big.play { background: var(--blue); color: #fff; }
  .t-toss .big.sheet { background: var(--card); color: var(--ink); }
  .t-toss .chk i { border-radius: 5px; background: var(--blue); }
  .t-toss .hist { background: var(--card); border-radius: 18px; }
  .t-toss .exam .top em { font-style: normal; color: var(--ink-2); }
  .t-toss .exam .top .end { color: #f04452; }
  .t-toss .timer { text-align: center; }
  .t-toss .timer small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .t-toss .timer strong { display: block; font-size: 58px; font-weight: 800; letter-spacing: -0.03em; }
  .t-toss .pause { background: #e8f3ff; color: var(--blue); border-radius: 10px; }
  .t-toss .side div { background: var(--card); color: var(--ink-2); border-radius: 16px; }
  .t-toss .next { background: var(--blue); color: #fff; border-radius: 22px; }
  .t-toss .tabs { background: #e5e8eb; border-radius: 12px; }
  .t-toss .tabs .on { background: #fff; border-radius: 9px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
  .t-toss .tabs div:not(.on) { color: var(--muted); }
  .t-toss .chips div { background: #fff; border-radius: 999px; color: var(--ink-2); }
  .t-toss .chips .on { background: var(--ink); color: #fff; }
  .t-toss .sheet { background: var(--card); border-radius: 20px; }
  .t-toss .sheet .meta span { color: var(--blue); }
  .t-toss .grp { background: #f9fafb; border-radius: 12px; }
  .t-toss .grp span { color: var(--muted); }
  .t-toss .grp b { color: var(--blue); }

  /* ========== C. 집중 다크 ========== */
  .t-dark { --bg: #0e1013; --ink: #eceef1; --ink-2: #b9bec7; --muted: #6f7682; --acc: #ffb547; --card: #181b20; --line: #262a31; }
  .t-dark .big { border-radius: 18px; }
  .t-dark .big.play { background: var(--acc); color: #1a1205; }
  .t-dark .big.sheet { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .t-dark .chk i { border-radius: 4px; border: 2px solid var(--acc); background: var(--acc); }
  .t-dark .hist { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .t-dark .hist div + div { border-top: 1px solid var(--line); }
  .t-dark .exam .top em { font-style: normal; color: var(--muted); }
  .t-dark .exam .top .end { color: #ff6b6b; }
  .t-dark .timer { text-align: center; }
  .t-dark .timer strong { display: block; font-size: 62px; font-weight: 300; letter-spacing: 0.02em; color: #fff; }
  .t-dark .timer small { display: block; font-size: 11px; letter-spacing: 0.3em; color: var(--acc); font-weight: 700; }
  .t-dark .pause { border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px; }
  .t-dark .ctl { background: #0a0b0d; border-top: 1px solid var(--line); }
  .t-dark .side div { background: var(--card); color: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; }
  .t-dark .next { background: var(--acc); color: #1a1205; border-radius: 18px; }
  .t-dark .tabs { background: var(--card); border-radius: 12px; }
  .t-dark .tabs .on { background: #2a2f37; color: #fff; border-radius: 9px; }
  .t-dark .tabs div:not(.on) { color: var(--muted); }
  .t-dark .chips div { background: var(--card); border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }
  .t-dark .chips .on { background: var(--acc); color: #1a1205; border-color: var(--acc); }
  .t-dark .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .t-dark .sheet .meta span { color: var(--acc); }
  .t-dark .grp { border: 1px solid var(--line); border-radius: 10px; }
  .t-dark .grp > div + div { border-top: 1px solid var(--line); }
  .t-dark .grp span { color: var(--muted); }
</style>
</head>
<body>
<h1>랩 타이머 디자인 시안 3종</h1>
<p class="lead">같은 화면(처음 · 시험 중 · 답지)을 세 가지 방향으로 그린 시안이에요. 색·모양만 비교용이고, 고른 뒤 실제 앱에 적용합니다. 글꼴은 모두 Pretendard.</p>

<div id="themes"></div>

<script>
  const play = '<svg viewBox="0 0 48 48"><path d="M17 11 L38 24 L17 37 Z" fill="currentColor"/></svg>'
  const sheet = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6 H29 L37 14 V42 H13 Z"/><path d="M29 6 V14 H37"/><path d="M18 21 H31 M18 27 H31 M18 33 H26"/></svg>'
  const answers = [4,3,4,5,4, 1,3,4,5,5, 3,5,1,2,2, 3,3,5,1,5]
  const C = ['', '①','②','③','④','⑤']

  const intro = () => `
    <div class="screen intro">
      <div><div class="title">문제별 <span>랩</span> 타이머</div><div class="sub">풀 때는 탭만, 분석은 끝나고.</div></div>
      <div class="btns"><div class="big play">${play}시험 시작</div><div class="big sheet">${sheet}답지 보기</div></div>
      <div class="chk"><i></i>설정 없이 바로 시작</div>
      <div class="hist"><h4>지난 기록</h4>
        <div><span>27 국어 수능</span><small>11. 24.</small></div>
        <div><span>26 7급 PSAT 언어</span><small>11. 23.</small></div>
      </div>
      <div class="ver">v0.1.0</div>
    </div>`

  const exam = () => `
    <div class="screen exam">
      <div class="top"><em>⊞ 문항표</em><span class="end">종료</span></div>
      <div class="mid">
        <div class="timer tnum"><small>경과 시간</small><strong>23:41</strong></div>
        <div class="pause">❚❚ 일시정지</div>
      </div>
      <div class="ctl">
        <div class="side"><div>되돌리기</div><div>건너뛰기</div></div>
        <div class="next"><b class="tnum">12</b><span>다음</span></div>
      </div>
    </div>`

  const ans = () => {
    const groups = [0,5,10,15].map(s => `<div class="grp">${answers.slice(s, s+5).map((a,i) =>
      `<div><span class="tnum">${s+i+1}</span><b>${C[a]}</b></div>`).join('')}</div>`).join('')
    return `
    <div class="screen ans">
      <div class="hd">답지 보기</div>
      <div class="tabs"><div>5급 PSAT</div><div class="on">7급 PSAT</div><div>9급</div></div>
      <div class="chips"><div class="on">2026</div><div>2025</div><div>2024</div><div>2023</div></div>
      <div class="chips"><div class="on">언어논리</div><div>자료해석</div><div>상황판단</div></div>
      <div class="sheet"><div class="meta"><span>2026 7급 · 언어논리</span><span>사 책형</span></div><div class="grid">${groups}</div></div>
    </div>`
  }

  const THEMES = [
    ['t-omr', 'A. OMR 답안지', '수능·공시 OMR 카드의 분홍·빨강 줄과 컴퓨터용 사인펜 같은 검정. 이 앱만의 정체성이 가장 강하고, 답지·문항표와 자연스럽게 이어집니다. 단점: 빨강이 많으면 "틀림"처럼 보일 수 있어 양 조절이 필요.'],
    ['t-toss', 'B. 토스 스타일', '밝은 회색 바탕 + 흰 카드 + 파랑 포인트, 테두리 없이 큰 글씨. 한국 앱 사용자에게 가장 익숙하고 깔끔합니다. 단점: 흔해서 이 앱만의 개성은 약함.'],
    ['t-dark', 'C. 집중 다크', '검정 바탕에 밝은 숫자, 호박색 포인트. 눈부심이 적어 밤 연습·집중에 좋고 시간이 가장 잘 보입니다. 단점: 흰 종이 시험지 옆에 두면 대비가 커서 눈이 왔다 갔다 할 수 있음.'],
  ]

  document.getElementById('themes').innerHTML = THEMES.map(([cls, name, desc]) => `
    <section class="theme ${cls}">
      <h2>${name}</h2><p>${desc}</p>
      <div class="row">
        <div class="col"><div class="phone">${intro()}</div><div class="cap">처음 화면</div></div>
        <div class="col"><div class="phone">${exam()}</div><div class="cap">시험 중</div></div>
        <div class="col"><div class="phone">${ans()}</div><div class="cap">답지</div></div>
      </div>
    </section>`).join('')
</script>
</body>
</html>
